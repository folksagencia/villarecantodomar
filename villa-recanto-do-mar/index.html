<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pousada Villa Recanto do Mar — Reservas</title>
<meta name="description" content="Reserve diretamente com a Pousada Villa Recanto do Mar. Sinal de 30% via Pix, sem taxas de intermediários." />
<link rel="stylesheet" href="/assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/index.html"><img src="/assets/img/logo-white.png" alt="Villa Recanto do Mar" class="brand-logo"><small>Reservas diretas</small></a>
  </div>
</header>

<div class="container">
  <div id="propertyGallerySection" style="margin-top:28px;"></div>

  <h1 class="section-title" style="margin-top:32px;">Nossos quartos</h1>
  <p class="section-sub">Escolha as datas, pague 30% de sinal via Pix para garantir e o restante você acerta no check-in.</p>

  <div id="rooms" class="room-grid">
    <div class="empty-state"><span class="spinner"></span><p>Carregando quartos…</p></div>
  </div>
</div>

<p class="footer-note">Pousada Villa Recanto do Mar — reserva feita direto com a pousada.</p>

<script src="/assets/supabase-client.js"></script>
<script src="/assets/format.js"></script>
<script src="/assets/gallery.js"></script>
<script>
async function loadPropertyGallery() {
  const section = document.getElementById("propertyGallerySection");
  const { data: photos, error } = await villaSupabase
    .from("property_photos")
    .select("url,caption")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error || !photos || photos.length === 0) {
    section.innerHTML = "";
    return;
  }

  section.innerHTML = `
    <h2 class="section-title" style="font-size:1.3rem;">Conheça a pousada</h2>
    <div id="propertyGallery" style="margin-bottom:8px;"></div>
  `;
  renderGallery("propertyGallery", photos, { alt: "Pousada Villa Recanto do Mar", showCaption: true });
}

async function loadRooms() {
  const container = document.getElementById("rooms");
  const { data: rooms, error } = await villaSupabase
    .from("rooms")
    .select("slug,name,description,base_price,photos")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error) {
    container.innerHTML = '<div class="empty-state">Não foi possível carregar os quartos agora. Tente novamente em instantes.</div>';
    console.error(error);
    return;
  }

  if (!rooms || rooms.length === 0) {
    container.innerHTML = '<div class="empty-state">Nenhum quarto cadastrado ainda.</div>';
    return;
  }

  container.innerHTML = rooms.map(roomCardHtml).join("");
}

function roomCardHtml(room) {
  const cover = Array.isArray(room.photos) && room.photos.length > 0 ? room.photos[0] : null;
  const coverImg = cover
    ? `<img src="${escapeAttr(cover)}" alt="${escapeAttr(room.name)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;">`
    : "";
  return `
    <a class="card room-card" href="/quarto.html?slug=${encodeURIComponent(room.slug)}" style="text-decoration:none;color:inherit;">
      <div class="photo">${coverImg}</div>
      <div class="card-body">
        <h3>${escapeHtml(room.name)}</h3>
        <p>${escapeHtml(room.description || "")}</p>
        <div class="price-tag">a partir de ${formatBRL(room.base_price)} <small>/ noite</small></div>
      </div>
    </a>
  `;
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

loadPropertyGallery();
loadRooms();
</script>
</body>
</html>
