<script src="/assets/supabase-client.js"></script>
<script src="/assets/format.js"></script>
<script src="/assets/gallery.js"></script>
<script>
async function loadPropertyGallery() {
  const section = document.getElementById("propertyGallerySection");
  const { data: photos, error } = await villaSupabase
    .from("property_photos")
    .select("url,caption")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error || !photos || photos.length === 0) {
    section.innerHTML = "";
    return;
  }

  section.innerHTML = `
    <h2 class="section-title" style="font-size:1.3rem;margin-top:8px;">Conheça a pousada</h2>
    <div id="propertyGallery" style="margin-bottom:8px;"></div>
  `;
  renderGallery("propertyGallery", photos, { alt: "Pousada Villa Recanto do Mar", showCaption: true, autoplay: 4500 });
}

async function loadRooms() {
  const container = document.getElementById("rooms");
  const { data: rooms, error } = await villaSupabase
    .from("rooms")
    .select("slug,name,description,base_price,capacity,photos")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error) {
    container.innerHTML = '<div class="empty-state">Não foi possível carregar as acomodações agora. Tente novamente em instantes.</div>';
    console.error(error);
    return;
  }

  if (!rooms || rooms.length === 0) {
    container.innerHTML = '<div class="empty-state">Nenhuma acomodação cadastrada ainda.</div>';
    return;
  }

  container.innerHTML = rooms.map(roomCardHtml).join("");
  setupCoverCarousels(rooms);
}

const CARD_MAX_PHOTOS = 4;

function roomCardHtml(room, i) {
  const photos = Array.isArray(room.photos) ? room.photos.slice(0, CARD_MAX_PHOTOS) : [];
  return `
    <a class="card room-card" id="roomCard-${i}" href="/quarto.html?slug=${encodeURIComponent(room.slug)}" style="text-decoration:none;color:inherit;">
      <div class="photo">
        <div class="room-card-gallery" id="roomCoverGallery-${i}"></div>
        <span class="room-card-badge">Café da manhã incluído</span>
      </div>
      <div class="card-body">
        <h3>${escapeHtml(room.name)}</h3>
        <p>${escapeHtml(room.description || "")}</p>
        <p class="room-card-meta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          até ${room.capacity || 1} pessoa(s)
        </p>
        <div class="price-tag">a partir de ${formatBRL(room.base_price)} <small>/ noite</small></div>
      </div>
    </a>
  `;
}

// Carrossel de fotos da capa de cada card, com setas (aparecem no hover),
// bolinhas de posição e troca automática — pausa quando a pessoa interage
// e desliga sozinho se ela prefere menos animação (config. de acessibilidade).
function setupCoverCarousels(rooms) {
  rooms.forEach((room, i) => {
    const photos = Array.isArray(room.photos) ? room.photos.slice(0, CARD_MAX_PHOTOS) : [];
    renderCardCarousel(`roomCoverGallery-${i}`, photos, {
      alt: room.name,
      autoplay: 4200 + i * 300, // pequeno intervalo diferente por card, pra não trocarem todos junto
    });
  });
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

const copyAddressBtn = document.getElementById("copyAddressBtn");
copyAddressBtn.addEventListener("click", () => {
  const input = document.getElementById("addressText");
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(input.value).then(() => {
    document.getElementById("copyAddressFeedback").textContent = "Endereço copiado!";
    copyAddressBtn.classList.add("is-copied");
    copyAddressBtn.querySelector(".copy-field-btn-label").textContent = "Copiado!";
    clearTimeout(copyAddressBtn._resetTimer);
    copyAddressBtn._resetTimer = setTimeout(() => {
      copyAddressBtn.classList.remove("is-copied");
      copyAddressBtn.querySelector(".copy-field-btn-label").textContent = "Copiar";
    }, 2200);
  }).catch(() => {
    document.getElementById("copyAddressFeedback").textContent = "Não foi possível copiar automaticamente — selecione e copie manualmente.";
  });
});

loadPropertyGallery();
loadRooms();
</script>
