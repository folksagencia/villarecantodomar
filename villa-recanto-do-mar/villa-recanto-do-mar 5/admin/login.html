<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Painel Villa Recanto do Mar</title>
<link rel="stylesheet" href="/assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:var(--teal-900);min-height:100vh;">

<div class="container-narrow" style="padding-top:70px;">
  <div style="text-align:center;">
    <img src="/assets/img/logo-white.png" alt="Villa Recanto do Mar" style="height:64px;width:auto;margin:0 auto 8px;">
    <p style="font-weight:400;font-size:0.85rem;color:var(--teal-100);margin:0;">Painel administrativo</p>
  </div>

  <div class="card" style="margin-top:24px;"><div class="card-body">
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username">

    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password">

    <div id="loginAlert"></div>

    <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:20px;">Entrar</button>
  </div></div>

  <p class="help-text" style="text-align:center;color:var(--teal-100);margin-top:16px;">
    Esqueceu a senha? Redefina pelo painel do Supabase (Authentication → Users) ou peça a quem configurou o site.
  </p>
</div>

<script src="/assets/supabase-client.js"></script>
<script>
async function checkExistingSession() {
  const { data: { session } } = await villaSupabase.auth.getSession();
  if (session) location.href = "/admin/index.html";
}
checkExistingSession();

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const alertBox = document.getElementById("loginAlert");
  alertBox.innerHTML = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alertBox.innerHTML = '<div class="alert alert-danger">Preencha e-mail e senha.</div>';
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Entrando…';

  const { error } = await villaSupabase.auth.signInWithPassword({ email, password });

  if (error) {
    alertBox.innerHTML = `<div class="alert alert-danger">${error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Entrar";
    return;
  }

  location.href = "/admin/index.html";
}
</script>
</body>
</html>
