<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reservas — Painel Villa Recanto do Mar</title>
<link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192x192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
<link rel="stylesheet" href="/assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-shell">
  <nav class="admin-sidebar" id="adminNav"></nav>
  <main class="admin-main">
    <h1 class="section-title">Reservas</h1>
    <p class="section-sub">Confirme o pagamento do sinal depois de conferir o Pix recebido (extrato do banco ou comprovante no WhatsApp).</p>

    <div class="card" style="margin-bottom:20px;max-width:720px;"><div class="card-body">
      <label style="margin-top:0;">Período (data em que a reserva foi feita)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-sm btn-secondary" data-range="hoje">Hoje</button>
        <button class="btn btn-sm btn-secondary" data-range="7">Últimos 7 dias</button>
        <button class="btn btn-sm btn-secondary" data-range="30">Últimos 30 dias</button>
        <button class="btn btn-sm btn-secondary" data-range="todas">Tudo</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;">
        <div style="flex:1;min-width:130px;">
          <label style="margin:0 0 6px;font-size:0.78rem;">Personalizado — de</label>
          <input type="date" id="rangeFrom">
        </div>
        <div style="flex:1;min-width:130px;">
          <label style="margin:0 0 6px;font-size:0.78rem;">até</label>
          <input type="date" id="rangeTo">
        </div>
        <button class="btn btn-sm btn-primary" id="applyRangeBtn">Aplicar</button>
      </div>
    </div></div>

    <div class="stat-grid" id="statusGrid"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="btn btn-sm btn-secondary" data-filter="todas">Todas</button>
      <button class="btn btn-sm btn-secondary" data-filter="aguardando_pix">Aguardando Pix</button>
      <button class="btn btn-sm btn-secondary" data-filter="pix_confirmado">Confirmadas</button>
      <button class="btn btn-sm btn-secondary" data-filter="cancelada">Canceladas</button>
      <button class="btn btn-sm btn-secondary" data-filter="concluida">Concluídas</button>
    </div>

    <div id="actionAlert"></div>
    <div class="table-wrap" id="table"></div>
  </main>
</div>

<script src="/assets/supabase-client.js"></script>
<script src="/assets/format.js"></script>
<script src="/assets/admin-common.js"></script>
<script>
let currentFilter = "todas";
let currentUserEmail = "";
let currentRange = { since: null, until: null, label: "últimos 30 dias" };

function daysAgoISO(days) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString();
}
function startOfDayISO(dateStr) { return new Date(dateStr + "T00:00:00").toISOString(); }
function endOfDayISO(dateStr) { return new Date(dateStr + "T23:59:59.999").toISOString(); }

function setPresetRange(kind) {
  if (kind === "hoje") currentRange = { since: startOfDayISO(todayISODate()), until: null, label: "hoje" };
  else if (kind === "7") currentRange = { since: daysAgoISO(7), until: null, label: "últimos 7 dias" };
  else if (kind === "todas") currentRange = { since: null, until: null, label: "todo o período" };
  else currentRange = { since: daysAgoISO(30), until: null, label: "últimos 30 dias" };
  document.getElementById("rangeFrom").value = "";
  document.getElementById("rangeTo").value = "";
}

function setCustomRange() {
  const from = document.getElementById("rangeFrom").value;
  const to = document.getElementById("rangeTo").value;
  if (!from || !to || to < from) {
    alert("Escolha um período válido: data inicial antes (ou igual) da data final.");
    return;
  }
  currentRange = { since: startOfDayISO(from), until: endOfDayISO(to), label: `${formatDateBR(from)} até ${formatDateBR(to)}` };
}

function highlightRangeBtn(activeBtn) {
  document.querySelectorAll("[data-range]").forEach((b) => { b.classList.remove("btn-primary"); b.classList.add("btn-secondary"); });
  if (activeBtn) { activeBtn.classList.remove("btn-secondary"); activeBtn.classList.add("btn-primary"); }
}

async function init() {
  const session = await requireAdminAuth();
  if (!session) return;
  currentUserEmail = session.user.email;
  renderAdminNav("reservas");

  document.querySelectorAll("[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((b) => b.classList.remove("btn-primary"));
      btn.classList.add("btn-primary");
      renderTable();
    });
  });
  document.querySelector('[data-filter="todas"]').classList.add("btn-primary");

  document.querySelectorAll("[data-range]").forEach((btn) => {
    btn.addEventListener("click", () => {
      setPresetRange(btn.dataset.range);
      highlightRangeBtn(btn);
      load();
    });
  });
  document.getElementById("applyRangeBtn").addEventListener("click", () => {
    setCustomRange();
    highlightRangeBtn(null);
    load();
  });

  setPresetRange("30");
  highlightRangeBtn(document.querySelector('[data-range="30"]'));

  load();
}

let allReservations = [];

async function load() {
  const table = document.getElementById("table");
  table.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';

  let query = villaSupabase
    .from("reservations")
    .select("id,room_id,session_id,guest_name,guest_email,guest_phone,guest_count,children_ages,check_in,check_out,nights,total_price,deposit_amount,status,guest_marked_paid_at,confirmed_at,confirmed_by,created_at,rooms(name)")
    .order("created_at", { ascending: false });

  if (currentRange.since) query = query.gte("created_at", currentRange.since);
  if (currentRange.until) query = query.lte("created_at", currentRange.until);

  const { data, error } = await query;

  if (error) {
    table.innerHTML = '<div class="empty-state">Erro ao carregar reservas.</div>';
    console.error(error);
    return;
  }

  allReservations = data || [];
  renderStatusGrid();
  renderTable();
}

function isExpiredHold(r) {
  if (r.status !== "aguardando_pix" || r.guest_marked_paid_at) return false;
  const twoHoursMs = 2 * 60 * 60 * 1000;
  return Date.now() - new Date(r.created_at).getTime() > twoHoursMs;
}

function renderStatusGrid() {
  const counts = { aguardando_pix: 0, pix_confirmado: 0, cancelada: 0, concluida: 0, expirada: 0 };
  allReservations.forEach((r) => {
    if (isExpiredHold(r)) counts.expirada++;
    else if (counts[r.status] !== undefined) counts[r.status]++;
  });
  document.getElementById("statusGrid").innerHTML = `
    <div class="stat-card"><div class="value">${allReservations.length}</div><div class="label">Total (${esc(currentRange.label)})</div></div>
    <div class="stat-card"><div class="value">${counts.aguardando_pix}</div><div class="label">Aguardando Pix</div></div>
    <div class="stat-card"><div class="value">${counts.pix_confirmado}</div><div class="label">Confirmadas</div></div>
    <div class="stat-card"><div class="value">${counts.cancelada}</div><div class="label">Canceladas</div></div>
    <div class="stat-card"><div class="value">${counts.concluida}</div><div class="label">Concluídas</div></div>
    <div class="stat-card"><div class="value">${counts.expirada}</div><div class="label">Pix expirado (sem retorno)</div></div>
  `;
}

function renderTable() {
  const table = document.getElementById("table");
  const data = currentFilter === "todas" ? allReservations : allReservations.filter((r) => r.status === currentFilter);

  if (!data || data.length === 0) {
    table.innerHTML = '<div class="empty-state">Nenhuma reserva encontrada para esse filtro/período.</div>';
    return;
  }

  table.innerHTML = `
    <table>
      <thead>
        <tr><th>Status</th><th>Hóspede</th><th>Acomodação</th><th>Datas</th><th>Total</th><th>Sinal</th><th>Registrado em</th><th>Ações</th></tr>
      </thead>
      <tbody>
        ${data.map(rowHtml).join("")}
      </tbody>
    </table>
  `;

  data.forEach((r) => {
    const confirmBtn = document.getElementById("confirm-" + r.id);
    if (confirmBtn) confirmBtn.addEventListener("click", () => confirmReservation(r.id));
    const cancelBtn = document.getElementById("cancel-" + r.id);
    if (cancelBtn) cancelBtn.addEventListener("click", () => cancelReservation(r.id));
    const deleteBtn = document.getElementById("delete-" + r.id);
    if (deleteBtn) deleteBtn.addEventListener("click", () => deleteReservation(r));
  });
}

function statusBadge(status) {
  const map = {
    aguardando_pix: '<span class="badge badge-warn">Aguardando Pix</span>',
    pix_confirmado: '<span class="badge badge-success">Confirmada</span>',
    cancelada: '<span class="badge badge-danger">Cancelada</span>',
    concluida: '<span class="badge badge-neutral">Concluída</span>',
  };
  return map[status] || status;
}

function rowHtml(r) {
  const expired = isExpiredHold(r);
  const notice = r.guest_marked_paid_at
    ? '<br><span class="help-text">✋ hóspede avisou que pagou</span>'
    : (expired ? '<br><span class="badge badge-neutral" style="margin-top:4px;">Pix expirado (sem retorno em 2h)</span>' : "");
  let actions = "";
  if (r.status === "aguardando_pix") {
    actions = `<button class="btn btn-primary btn-sm" id="confirm-${r.id}">Confirmar Pix</button> <button class="btn btn-danger btn-sm" id="cancel-${r.id}">Cancelar</button>`;
  } else if (r.status === "pix_confirmado") {
    actions = `<button class="btn btn-danger btn-sm" id="cancel-${r.id}">Cancelar</button>`;
  }
  actions += ` <button class="btn btn-outline-danger btn-sm" id="delete-${r.id}" title="Remove a reserva permanentemente — use para testes ou registros indevidos">Excluir</button>`;
  const children = Array.isArray(r.children_ages) ? r.children_ages : [];
  const guestInfo = `${r.guest_count || 1} hóspede(s)` + (children.length ? ` · ${children.length} criança(s) (${children.join(", ")} anos)` : "");
  const contact = [r.guest_email, r.guest_phone].filter(Boolean).join(" · ");
  return `
    <tr>
      <td>${statusBadge(r.status)}${notice}</td>
      <td>${esc(r.guest_name)}<br><span class="help-text">${esc(contact)}</span><br><span class="help-text">${esc(guestInfo)}</span></td>
      <td>${esc(r.rooms ? r.rooms.name : "")}</td>
      <td>${formatDateBR(r.check_in)} – ${formatDateBR(r.check_out)} (${r.nights}n)</td>
      <td>${formatBRL(r.total_price)}</td>
      <td>${formatBRL(r.deposit_amount)}</td>
      <td><span class="help-text">${formatDateTimeBR(r.created_at)}</span></td>
      <td>${actions}</td>
    </tr>
  `;
}

async function confirmReservation(id) {
  if (!confirm("Confirmar que o sinal via Pix foi recebido para esta reserva?")) return;
  const { error } = await villaSupabase
    .from("reservations")
    .update({ status: "pix_confirmado", confirmed_at: new Date().toISOString(), confirmed_by: currentUserEmail })
    .eq("id", id);

  showActionResult(error, "Reserva confirmada.");
  load();
}

async function cancelReservation(id) {
  if (!confirm("Cancelar esta reserva?")) return;
  const { error } = await villaSupabase.from("reservations").update({ status: "cancelada" }).eq("id", id);
  showActionResult(error, "Reserva cancelada.");
  load();
}

async function deleteReservation(r) {
  const ok = confirm(
    `Excluir permanentemente a reserva de "${r.guest_name || "hóspede"}"?\n\n` +
    "Isso remove o registro por completo (não é só cancelar) — some da lista e não entra mais em nenhuma estatística do painel, " +
    "incluindo o \"Reservas com Pix gerado\" do funil, se ela tiver chegado a gerar Pix. " +
    "Use para reservas de teste ou lançadas por engano. Não é possível desfazer."
  );
  if (!ok) return;

  // Apaga também o evento de funil "gerou_pix" correspondente (mesma sessão
  // anônima + mesma acomodação), pra essa reserva de teste não continuar
  // inflando a contagem do dashboard mesmo depois de excluída. Reservas
  // criadas antes dessa coluna existir não têm session_id — nesse caso só
  // a reserva é removida mesmo, sem afetar o funil.
  if (r.session_id) {
    const { error: funnelError } = await villaSupabase
      .from("funnel_events")
      .delete()
      .eq("session_id", r.session_id)
      .eq("room_id", r.room_id)
      .eq("stage", "gerou_pix");
    if (funnelError) console.error("Erro ao limpar evento de funil:", funnelError);
  }

  const { error } = await villaSupabase.from("reservations").delete().eq("id", r.id);
  showActionResult(error, "Reserva excluída.");
  load();
}

function showActionResult(error, successMsg) {
  const box = document.getElementById("actionAlert");
  box.innerHTML = error
    ? `<div class="alert alert-danger">Erro: ${esc(error.message)}</div>`
    : `<div class="alert alert-success">${successMsg}</div>`;
  setTimeout(() => { box.innerHTML = ""; }, 4000);
}

function esc(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

init();
</script>
</body>
</html>
