<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reservar — Villa Recanto do Mar</title>
<meta name="description" content="Reserve diretamente com a Pousada Villa Recanto do Mar. Sinal de 30% via Pix, sem taxas de intermediários." />

<link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192x192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Pousada Villa Recanto do Mar" />
<meta property="og:title" content="Reservar — Villa Recanto do Mar" />
<meta property="og:description" content="Reserve diretamente com a Pousada Villa Recanto do Mar. Sinal de 30% via Pix, sem taxas de intermediários." />
<meta property="og:image" content="https://villarecantodomar.vercel.app/assets/img/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://villarecantodomar.vercel.app/assets/img/og-image.png" />

<link rel="stylesheet" href="/assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/index.html"><img src="/assets/img/logo.png" alt="Villa Recanto do Mar" class="brand-logo"><small>RESERVAS</small></a>
  </div>
</header>

<div class="container-narrow" id="page" style="padding-top:28px;padding-bottom:60px;">
  <div class="empty-state"><span class="spinner"></span><p>Carregando…</p></div>
</div>

<script src="/assets/supabase-client.js"></script>
<script src="/assets/format.js"></script>
<script src="/assets/gallery.js"></script>
<script src="/lib/pricing.js"></script>
<script src="/assets/session.js"></script>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get("slug");
let room = null;

async function init() {
  const page = document.getElementById("page");

  if (!slug) {
    page.innerHTML = '<div class="empty-state">Acomodação não especificada.</div>';
    return;
  }

  const { data, error } = await villaSupabase
    .from("rooms")
    .select("id,slug,name,description,capacity,base_price,photos")
    .eq("slug", slug)
    .eq("active", true)
    .maybeSingle();

  if (error || !data) {
    page.innerHTML = '<div class="empty-state">Esta acomodação não foi encontrada ou não está mais disponível.</div>';
    return;
  }

  room = data;
  logVillaEvent({ type: "view", room_id: room.id, stage: "viu_quarto" });
  render();
  loadAvailability();
}

let fullyBookedSet = new Set();

async function loadAvailability() {
  try {
    const res = await fetch(`/api/room-availability?room_id=${encodeURIComponent(room.id)}`);
    const data = await res.json();
    if (res.ok && Array.isArray(data.fullyBookedDates)) {
      fullyBookedSet = new Set(data.fullyBookedDates);
      if (lastStay) recalculate(); // reavalia caso as datas já escolhidas tenham acabado de lotar
    }
  } catch (e) {
    console.warn("Não foi possível checar disponibilidade agora:", e);
    // Não impede o uso do site — o servidor confere de novo na hora de reservar.
  }
}

function findNextAvailableRange(nightsCount, searchFromDate) {
  const maxDate = addDaysISO(todayISODate(), 170);
  let cursor = searchFromDate;
  while (cursor < maxDate) {
    let ok = true;
    for (let i = 0; i < nightsCount; i++) {
      if (fullyBookedSet.has(addDaysISO(cursor, i))) { ok = false; break; }
    }
    if (ok) return { checkIn: cursor, checkOut: addDaysISO(cursor, nightsCount) };
    cursor = addDaysISO(cursor, 1);
  }
  return null;
}

async function loadPropertyGallery() {
  const section = document.getElementById("propertyGallerySection");
  if (!section) return;
  const { data: photos, error } = await villaSupabase
    .from("property_photos")
    .select("url,caption")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error || !photos || photos.length === 0) {
    section.innerHTML = "";
    return;
  }

  section.innerHTML = `
    <h3 style="margin:20px 0 8px;">Conheça a pousada</h3>
    <div id="propertyGallery" style="margin-bottom:20px;"></div>
  `;
  renderGallery("propertyGallery", photos, { alt: "Pousada Villa Recanto do Mar", showCaption: true, autoplay: 4500 });
}

function render() {
  const page = document.getElementById("page");
  const photos = Array.isArray(room.photos) && room.photos.length > 0 ? room.photos : [];

  const today = todayISODate();
  const minCheckout = addDaysISO(today, 1);

  page.innerHTML = `
    <div id="roomGallery" style="margin-bottom:18px;"></div>
    <h1 class="section-title">${esc(room.name)}</h1>
    <p class="section-sub">${esc(room.description || "")} · Capacidade: ${room.capacity} pessoa(s)</p>

    <div id="propertyGallerySection"></div>

    <div class="card"><div class="card-body">
      <div class="field-row">
        <div>
          <label for="checkin">Check-in</label>
          <input type="date" id="checkin" min="${today}" value="${today}">
        </div>
        <div>
          <label for="checkout">Check-out</label>
          <input type="date" id="checkout" min="${minCheckout}" value="${minCheckout}">
        </div>
      </div>

      <div id="priceSummary" style="margin-top:16px;"></div>
      <div id="calcAlert"></div>
    </div></div>

    <div class="card" style="margin-top:20px;"><div class="card-body">
      <h3 style="margin-top:0;">Seus dados</h3>
      <label for="guestName">Nome completo</label>
      <input type="text" id="guestName" placeholder="Seu nome">

      <label for="guestPhone">WhatsApp para contato</label>
      <input type="tel" id="guestPhone" placeholder="(00) 00000-0000">

      <label for="guestEmail">E-mail (opcional)</label>
      <input type="email" id="guestEmail" placeholder="voce@email.com">

      <div class="field-row">
        <div>
          <label for="guestCount">Nº de hóspedes</label>
          <select id="guestCount"></select>
        </div>
        <div>
          <label for="childCount">Crianças</label>
          <select id="childCount">
            <option value="0">Nenhuma</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
      </div>
      <p class="help-text" id="capacityHint"></p>

      <div id="childAgesWrap"></div>

      <div id="submitAlert"></div>

      <button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:20px;">Reservar e gerar Pix do sinal</button>
      <p class="help-text" style="text-align:center;margin-top:10px;">Você paga 30% agora via Pix para garantir a reserva. O restante é pago no check-in (débito, crédito, Pix ou crédito em até 3x).</p>
    </div></div>
  `;

  renderGallery("roomGallery", photos, { alt: room.name, autoplay: 5000 });
  loadPropertyGallery();

  document.getElementById("checkin").addEventListener("change", onDatesChange);
  document.getElementById("checkout").addEventListener("change", onDatesChange);
  document.getElementById("submitBtn").addEventListener("click", onSubmit);

  const guestCountSel = document.getElementById("guestCount");
  const capacity = Math.max(1, Number(room.capacity) || 1);
  guestCountSel.innerHTML = range(1, capacity).map((n) => `<option value="${n}">${n}</option>`).join("");
  document.getElementById("capacityHint").textContent = `Esta acomodação acomoda até ${capacity} pessoa(s) no total (inclua as crianças na contagem).`;

  document.getElementById("childCount").addEventListener("change", onChildCountChange);
  renderChildAges(0);

  applyPrefill();

  recalculate();
}

function applyPrefill() {
  const prefillName = params.get("name");
  const prefillPhone = params.get("phone");
  const prefillEmail = params.get("email");
  if (prefillName) document.getElementById("guestName").value = prefillName;
  if (prefillPhone) document.getElementById("guestPhone").value = prefillPhone;
  if (prefillEmail) document.getElementById("guestEmail").value = prefillEmail;
}

function range(start, end) {
  const out = [];
  for (let i = start; i <= end; i++) out.push(i);
  return out;
}

function onChildCountChange() {
  renderChildAges(Number(document.getElementById("childCount").value || 0));
}

function renderChildAges(count) {
  const wrap = document.getElementById("childAgesWrap");
  if (!count) {
    wrap.innerHTML = "";
    return;
  }
  const ageOptions = range(0, 17).map((a) => `<option value="${a}">${a === 0 ? "menos de 1 ano" : a + " anos"}</option>`).join("");
  let html = '<div class="field-row" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">';
  for (let i = 1; i <= count; i++) {
    html += `
      <div>
        <label for="childAge${i}">Idade da criança ${i}</label>
        <select id="childAge${i}">${ageOptions}</select>
      </div>
    `;
  }
  html += "</div>";
  wrap.innerHTML = html;
}

let lastStay = null;

async function recalculate() {
  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;
  const summary = document.getElementById("priceSummary");
  const alertBox = document.getElementById("calcAlert");
  alertBox.innerHTML = "";
  lastStay = null;

  if (!checkin || !checkout || checkout <= checkin) {
    summary.innerHTML = "";
    return;
  }

  summary.innerHTML = '<span class="spinner"></span>';

  const { data: overrides, error } = await villaSupabase
    .from("price_overrides")
    .select("date,price,is_blocked")
    .eq("room_id", room.id)
    .gte("date", checkin)
    .lt("date", checkout);

  if (error) {
    summary.innerHTML = "";
    alertBox.innerHTML = '<div class="alert alert-danger">Não foi possível calcular o preço agora.</div>';
    return;
  }

  const stay = VillaPricing.calculateStay({
    checkIn: checkin,
    checkOut: checkout,
    basePrice: room.base_price,
    overrides: overrides || [],
    depositPercent: 30,
  });

  lastStay = stay;

  if (stay.blockedDates.length > 0) {
    summary.innerHTML = "";
    alertBox.innerHTML = `<div class="alert alert-danger">Datas indisponíveis nesse período (${stay.blockedDates.map(formatDateBR).join(", ")}). Escolha outro período.</div>`;
    lastStay = null;
    return;
  }

  const fullNights = stay.nightly.map((n) => n.date).filter((d) => fullyBookedSet.has(d));
  if (fullNights.length > 0) {
    summary.innerHTML = "";
    lastStay = null;
    const suggestion = findNextAvailableRange(stay.nights, checkout);
    const suggestionHtml = suggestion
      ? `Encontramos uma opção livre pra você: <strong>${formatDateBR(suggestion.checkIn)} a ${formatDateBR(suggestion.checkOut)}</strong> (mesmas ${stay.nights} noite(s)). <button type="button" class="btn btn-sm btn-primary" id="useSuggestedBtn" style="margin-top:8px;">Usar essas datas</button>`
      : `No momento não achamos automaticamente outra data livre pra essa acomodação nos próximos meses — fale com a pousada pelo WhatsApp que a gente ajuda a encontrar uma opção.`;
    alertBox.innerHTML = `<div class="alert alert-warn">Essa acomodação já está com a lotação cheia em ${fullNights.map(formatDateBR).join(", ")}. ${suggestionHtml}</div>`;
    if (suggestion) {
      document.getElementById("useSuggestedBtn").addEventListener("click", () => {
        document.getElementById("checkin").value = suggestion.checkIn;
        document.getElementById("checkout").min = addDaysISO(suggestion.checkIn, 1);
        document.getElementById("checkout").value = suggestion.checkOut;
        recalculate();
      });
    }
    return;
  }

  summary.innerHTML = `
    <div class="alert alert-info" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
      <span>${stay.nights} noite(s)</span>
      <span>Total: <strong>${formatBRL(stay.totalPrice)}</strong></span>
      <span>Sinal (30%) hoje: <strong>${formatBRL(stay.depositAmount)}</strong></span>
    </div>
  `;
}

function onDatesChange() {
  const checkin = document.getElementById("checkin");
  const checkout = document.getElementById("checkout");
  const today = todayISODate();

  // Segurança extra: alguns navegadores de celular não bloqueiam
  // visualmente datas passadas no seletor nativo, mesmo com "min" definido.
  if (checkin.value && checkin.value < today) {
    checkin.value = today;
  }

  const minCheckout = addDaysISO(checkin.value, 1);
  checkout.min = minCheckout;
  if (checkout.value <= checkin.value) checkout.value = minCheckout;
  recalculate();
}

async function onSubmit() {
  const submitAlert = document.getElementById("submitAlert");
  submitAlert.innerHTML = "";

  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;
  const guestName = document.getElementById("guestName").value.trim();
  const guestEmail = document.getElementById("guestEmail").value.trim();
  const guestPhone = document.getElementById("guestPhone").value.trim();
  const guestCount = Number(document.getElementById("guestCount").value);
  const childCount = Number(document.getElementById("childCount").value || 0);
  const childrenAges = [];
  for (let i = 1; i <= childCount; i++) {
    childrenAges.push(Number(document.getElementById("childAge" + i).value));
  }

  if (checkin < todayISODate()) {
    submitAlert.innerHTML = '<div class="alert alert-danger">A data de check-in não pode estar no passado. Escolha outra data.</div>';
    return;
  }
  if (!lastStay) {
    submitAlert.innerHTML = '<div class="alert alert-danger">Escolha datas disponíveis antes de reservar.</div>';
    return;
  }
  if (!guestName || !guestPhone) {
    submitAlert.innerHTML = '<div class="alert alert-danger">Preencha nome e WhatsApp.</div>';
    return;
  }
  if (childCount > guestCount) {
    submitAlert.innerHTML = '<div class="alert alert-danger">O número de crianças não pode ser maior que o número total de hóspedes.</div>';
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Reservando…';

  logVillaEvent({ type: "funnel", room_id: room.id, stage: "iniciou_reserva" });

  try {
    const res = await fetch("/api/create-reservation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room_id: room.id,
        check_in: checkin,
        check_out: checkout,
        guest_name: guestName,
        guest_email: guestEmail,
        guest_phone: guestPhone,
        guest_count: guestCount,
        children_ages: childrenAges,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      submitAlert.innerHTML = `<div class="alert alert-danger">${esc(data.error || "Não foi possível reservar.")}</div>`;
      btn.disabled = false;
      btn.innerHTML = "Reservar e gerar Pix do sinal";
      return;
    }

    logVillaEvent({ type: "funnel", room_id: room.id, stage: "gerou_pix" });
    location.href = "/reserva.html?id=" + encodeURIComponent(data.id);
  } catch (e) {
    console.error(e);
    submitAlert.innerHTML = '<div class="alert alert-danger">Erro de conexão. Tente novamente.</div>';
    btn.disabled = false;
    btn.innerHTML = "Reservar e gerar Pix do sinal";
  }
}

function esc(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

init();
</script>
</body>
</html>
